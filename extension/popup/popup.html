<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Discord RPC</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <header class="header">
      <div class="brand">
        <span class="logo-netflix">NETFLIX</span>
        <span class="cross">✕</span>
        <span class="logo-discord">Discord</span>
      </div>
      <span class="badge" id="versionBadge">v1.0</span>
    </header>

    <div class="toggle-section">
      <div class="toggle-text">
        <div class="toggle-title">Rich Presence</div>
        <div class="toggle-desc">Share watch status on Discord</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="rpcToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="status-box">
      <div class="status-row">
        <span class="status-label">Local Bridge:</span>
        <span class="status-pill status-disconnected" id="bridgeStatus">
          <span class="dot"></span>
          <span class="text">Disconnected</span>
        </span>
      </div>
      <div class="status-row">
        <span class="status-label">Discord Desktop:</span>
        <span class="status-pill status-disconnected" id="discordStatus">
          <span class="dot"></span>
          <span class="text">Waiting</span>
        </span>
      </div>
    </div>

    <div class="media-box" id="mediaBox">
      <div class="media-header">
        <span class="media-icon">🎬</span>
        <span class="media-watching">Currently on Netflix</span>
      </div>
      <div class="media-title" id="mediaTitle">No video playing</div>
      <div class="media-subtitle" id="mediaSubtitle">Browse Netflix to start watching</div>
    </div>

    <div class="help-section" id="helpSection">
      <p class="help-text">⚠️ Local bridge not detected. Run <code>npm start</code> in the project folder.</p>
    </div>

    <footer class="footer">
      <button class="btn-refresh" id="refreshBtn">↻ Refresh</button>
      <a href="http://127.0.0.1:7777/status" target="_blank" class="footer-link">Server Status</a>
    </footer>
  </div>

  <script src="../dist/popup.js"></script>
</body>
</html>
